name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Run Multi-Platform Packaging Pipeline
        shell: powershell
        run: |
          .\build_release.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LibreM ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/release/LibreM_Setup_*.exe
            dist/release/LibreM-*-windows-amd64.zip
            dist/release/LibreM-*-linux-amd64.tar.gz
            dist/release/LibreM-*-darwin-arm64.tar.gz
            dist/release/LibreM-*-darwin-amd64.tar.gz
            dist/release/checksums.txt
